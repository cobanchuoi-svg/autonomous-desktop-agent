[tool.poetry]
name = "desktop-ai-agent"
version = "0.1.0"
description = "Experimental Windows desktop agent with local LLM workflows and computer vision"
authors = ["Desktop AI Team <agent@local>"]
readme = "README.md"
packages = [{include = "agent"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
loguru = "^0.7.2"
mss = "^9.0.1"
pillow = "^10.4.0"
pyautogui = "^0.9.54"
pynput = "^1.7.7"
customtkinter = "^5.2.2"
httpx = "^0.27.0"
numpy = ">=1.26.0"
psutil = ">=5.9.0"
pygetwindow = ">=0.0.9"

# Optional / Provider specific
llama-cpp-python = {version = ">=0.2.80", optional = true}
transformers = {version = ">=4.40.0", optional = true}
torch = {version = ">=2.2.0", optional = true}
paddleocr = {version = ">=2.7.3", optional = true}

[tool.poetry.extras]
llamacpp = ["llama-cpp-python"]
transformers = ["transformers", "torch"]
paddle = ["paddleocr"]
all = ["llama-cpp-python", "transformers", "torch", "paddleocr"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
desktop-agent = "agent.main:run_cli"
desktop-agent-gui = "agent.ui.launcher:main"
